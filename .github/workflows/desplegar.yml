name: Desplegar en AWS

# Cada push a main publica la web en S3 y vacía la caché de CloudFront.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  BUCKET: panazea-web
  DISTRIBUCION: E321OBTV7EW240

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Subir la web a S3
        run: |
          aws s3 sync . "s3://$BUCKET" --delete --only-show-errors \
            --exclude "*" \
            --include "index.html" --include "styles.css" \
            --include "favicon.png" --include "favicon.svg" --include "assets/*" \
            --cache-control "public, max-age=3600"
          aws s3 cp index.html "s3://$BUCKET/index.html" --only-show-errors \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, s-maxage=300"
      - name: Vaciar la caché de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUCION" --paths "/*" > /dev/null
