<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Clean white container matching original brand identity -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="rgba(76, 171, 213, 0.3)" stroke-width="2"/>
  
  <g transform="translate(14, 16) scale(0.8)">
    <!-- Connecting Purple Lines (Z shape) -->
    <path d="M 22 22 L 98 42 L 24 82 L 96 102" stroke="#390094" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Gold/Yellow Connector -->
    <line x1="48" y1="56" x2="74" y2="64" stroke="#E6C20F" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Central Gold Discs -->
    <g transform="translate(48, 56)">
      <ellipse cx="0" cy="2.5" rx="6.5" ry="3.8" fill="#917522"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="3.8" fill="#E6C20F"/>
      <ellipse cx="0" cy="0" rx="4.5" ry="2.4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(74, 64)">
      <ellipse cx="0" cy="2.5" rx="6.5" ry="3.8" fill="#917522"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="3.8" fill="#E6C20F"/>
      <ellipse cx="0" cy="0" rx="4.5" ry="2.4" fill="#FFFFFF"/>
    </g>

    <!-- Node 1: Top Left (small) -->
    <g transform="translate(20, 20)">
      <ellipse cx="0" cy="6" rx="12" ry="7" fill="#390094"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#4CABD5"/>
      <ellipse cx="0" cy="0" rx="9" ry="5" fill="#FFFFFF"/>
    </g>

    <!-- Node 2: Top Right (large) -->
    <g transform="translate(98, 42)">
      <ellipse cx="0" cy="10" rx="18" ry="10.5" fill="#390094"/>
      <ellipse cx="0" cy="0" rx="18" ry="10.5" fill="#4CABD5"/>
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="#FFFFFF"/>
    </g>

    <!-- Node 3: Bottom Left (medium) -->
    <g transform="translate(22, 82)">
      <ellipse cx="0" cy="9" rx="16" ry="9.5" fill="#390094"/>
      <ellipse cx="0" cy="0" rx="16" ry="9.5" fill="#4CABD5"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#FFFFFF"/>
    </g>

    <!-- Node 4: Bottom Right (large) -->
    <g transform="translate(96, 102)">
      <ellipse cx="0" cy="11" rx="19" ry="11" fill="#390094"/>
      <ellipse cx="0" cy="0" rx="19" ry="11" fill="#4CABD5"/>
      <ellipse cx="0" cy="0" rx="15" ry="8.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
